<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>登录若依系统</title>
    <meta name="description" content="若依后台管理框架">
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/font-awesome.min.css" rel="stylesheet"/>
    <link href="/css/style.min.css" rel="stylesheet"/>
    <link href="/css/login.min.css" rel="stylesheet"/>
    <link href="/ruoyi/css/ry-ui.css?v=4.8.3" rel="stylesheet"/>
    
    <meta name="renderer" content="webkit">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="favicon.ico"/>
    <style type="text/css">label.error { position:inherit;  }</style>
    
    <style type="text/css">
      html,body.signin{height:100%;margin:0}
      body.signin{position:relative;min-height:100vh}
      .signinpanel{width:638px!important;margin:0!important;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
      .signinpanel .row{display:flex;align-items:flex-start}
      .signinpanel form,.signinpanel .signin-info{align-self:center}
    </style>
    <script>
        if(window.top!==window.self){alert('未登录或登录超时。请重新登录');window.top.location=window.location};
    </script>
</head>
<body class="signin">
    <div class="signinpanel">
        <div class="row">
            <div class="col-sm-7">
                <div class="signin-info">
                    <div class="logopanel m-b">
                        <h1><img alt="[ 若依 ]" src="/ruoyi.png"></h1>
                    </div>
                    <div class="m-b"></div>
                    <h4>欢迎使用 <strong>若依 后台管理系统</strong></h4>
                    <ul class="m-b">
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> SpringBoot</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Mybatis</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Shiro</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Thymeleaf</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Bootstrap</li>
                    </ul>
                    
                </div>
            </div>
            <div class="col-sm-5">
                <form id="signupForm" autocomplete="off" novalidate="novalidate">
                    <h3 class="no-margins">登录：</h3>
                    <input type="text"     name="username" class="form-control uname"     placeholder="用户名" value=""    />
                    <input type="password" name="password" class="form-control pword"     placeholder="密码"   value="" />
					<div class="row m-t">
						<div class="col-xs-6">
						    <input type="text" name="validateCode" class="form-control code" placeholder="验证码" maxlength="5" />
						</div>
						<div class="col-xs-6">
							<a href="javascript:void(0);" title="点击更换验证码">
								<img src="/captcha/captchaImage?type=math" class="imgcode" width="85%"/>
							</a>
						</div>
					</div>
                    <div class="checkbox-custom">
				        <input type="checkbox" id="rememberme" name="rememberme"> <label for="rememberme">记住我</label>
				    </div>
                    <button class="btn btn-success btn-block" id="btnSubmit" data-loading="正在验证登录，请稍候...">登录</button>
                </form>
            </div>
        </div>
        <div class="signup-footer">
            <div class="pull-left">
                Copyright © 2018-2026 ruoyi.vip All Rights Reserved. <br>
            </div>
        </div>
    </div>
<script> var ctx = "\/"; var captchaType = "math"; var captchaEnabled = true;</script>


<script src="/js/jquery.min.js"></script>
<script src="/ajax/libs/validate/jquery.validate.min.js"></script>
<script src="/ajax/libs/layer/layer.min.js"></script>
<script src="/ajax/libs/blockUI/jquery.blockUI.js"></script>
<script src="/ruoyi/js/ry-ui.js?v=4.8.3"></script>
<script src="/ruoyi/login.js"></script>

<script>

captchaEnabled = false;
window.login = function () {
    var pwd = document.querySelector("input[name='password']").value;
    if (!pwd) { if (window.$.modal) $.modal.msg("请输入您的密码"); return false; }
    var btn = document.getElementById("btnSubmit");
    if (btn) { btn.disabled = true; btn.textContent = "正在验证登录，请稍候..."; }
    fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: "noreply", password: pwd })
    }).then(function (r) {
        if (!r.ok) throw new Error("用户名或密码错误");
        return r.json();
    }).then(function (data) {
        var TK = "poj" + "un_token";
        var tok = data.token || (data.data && data.data.token);
        if (!tok) throw new Error("登录失败");
        localStorage.setItem(TK, tok);
        document.cookie = TK + "=" + encodeURIComponent(tok) + "; path=/; SameSite=Lax";
        location.href = "/function/tasks";
    }).catch(function (e) {
        if (btn) { btn.disabled = false; btn.textContent = "登录"; }
        var c = document.querySelector(".imgcode"); if (c) c.click();
        if (window.$.modal) $.modal.msg(e.message || "登录失败");
        else alert(e.message || "登录失败");
    });
    return false;
};
</script>
</body>
</html>
