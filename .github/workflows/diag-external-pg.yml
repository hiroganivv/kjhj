name: diag external pg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    env:
      PGPASSWORD: ${{ secrets.EXTERNAL_PG_PASSWORD }}
    steps:
      - name: try psql raw password
        run: |
          echo "::add-mask::${PGPASSWORD}"
          echo "PGPASSWORD length: ${#PGPASSWORD}"
          for u in postgres; do for db in postgres; do
            echo "--- try $u@$db ---"
            psql -h 203.195.195.52 -p 65533 -U "$u" -d "$db" -tAc 'select current_user, version()' -w 2>&1 | head -3
          done; done
