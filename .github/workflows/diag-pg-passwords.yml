name: diag pg passwords
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - name: try password variants
        shell: bash
        run: |
          PWS=(
            'xxabcd!tt^FGG1Y'
            'xxabcd!ttFGG1Y'
            'xxabcdtt^FGG1Y'
            'xxabcdttFGG1Y'
            'postgres'
            'password'
            'xxabcd!tt^fgg1y'
          )
          for pw in "${PWS[@]}"; do
            echo "--- try len=${#pw} masked ---"
            echo "::add-mask::$pw"
            PGPASSWORD="$pw" psql -h 203.195.195.52 -p 65533 -U postgres -d postgres -tAc 'select 1' -w 2>&1 | head -1
          done
