name: diag pg passwords
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - name: try password variants
        shell: bash
        run: |
          set +e
          PWS=(
            'xxabcd!tt^FGG1Y'
            'xxabcd!ttFGG1Y'
            'xxabcdtt^FGG1Y'
            'xxabcdttFGG1Y'
            'xxabcd!tt^fgg1y'
            'postgres'
            'password'
            'xxabcd%21tt%5EFGG1Y'
          )
          n=0
          for pw in "${PWS[@]}"; do
            n=$((n+1))
            echo "=== variant $n (len ${#pw}) ==="
            echo "::add-mask::$pw"
            OUT=$(PGPASSWORD="$pw" psql -h 203.195.195.52 -p 65533 -U postgres -d postgres -tAc 'select 1' -w 2>&1)
            RC=$?
            if [ $RC -eq 0 ]; then echo "SUCCESS variant $n: $OUT"; else echo "FAIL variant $n: $(echo "$OUT" | head -1)"; fi
          done
