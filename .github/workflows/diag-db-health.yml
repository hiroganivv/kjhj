name: diag db health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    env:
      EXTPW: ${{ secrets.EXTERNAL_PG_PASSWORD }}
    steps:
      - name: db health snapshot
        shell: bash
        run: |
          export PGPASSWORD="$EXTPW"
          PSQL="psql -h 203.195.195.52 -p 65533 -U postgres -d postgres -w"
          echo "=== 1. connections by state ==="
          $PSQL -c "SELECT state, count(*) FROM pg_stat_activity GROUP BY state ORDER BY 2 DESC;" 2>&1
          echo "=== 2. long-running queries (>10s) ==="
          $PSQL -c "SELECT pid, now()-query_start AS dur, state, left(query,120) FROM pg_stat_activity WHERE query_start < now()-interval '10 seconds' AND state<>'idle' ORDER BY dur DESC LIMIT 15;" 2>&1
          echo "=== 3. blocking locks ==="
          $PSQL -c "SELECT blocked.pid AS blocked_pid, blocking.pid AS blocking_pid, left(blocked.query,80) FROM pg_stat_activity blocked JOIN pg_stat_activity blocking ON blocking.pid = ANY(pg_blocking_pids(blocked.pid)) LIMIT 10;" 2>&1
          echo "=== 4. connection count vs max ==="
          $PSQL -c "SELECT (SELECT count(*) FROM pg_stat_activity) AS cur, current_setting('max_connections')::int AS max;" 2>&1
          echo "=== 5. db size ==="
          $PSQL -c "SELECT pg_size_pretty(pg_database_size('postgres'));" 2>&1
          echo "=== 7. timeout settings ==="
          $PSQL -c "SHOW idle_in_transaction_session_timeout;" 2>&1
          $PSQL -c "SHOW statement_timeout;" 2>&1
          echo "=== 6. table counts ==="
          $PSQL -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 12;" 2>&1
