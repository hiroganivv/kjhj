name: tmp check bk
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  c:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 8
    steps:
      - name: check
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO_SSH }}
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${BACKUP_SSH_KEY}" > ~/.ssh/id_k
          chmod 600 ~/.ssh/id_k
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_k -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p 22"
          d=/tmp/chk-$$
          git clone --depth 1 "${BACKUP_REPO}" "${d}" || exit 1
          echo "=== snapshots ==="
          ls -1d "${d}"/db/snap-* 2>/dev/null | tail -8 || echo NONE
          echo "=== count ==="
          ls -1d "${d}"/db/snap-* 2>/dev/null | wc -l
          echo "=== latest detail ==="
          latest=$(ls -1d "${d}"/db/snap-* 2>/dev/null | sort -r | head -1)
          if [ -n "${latest}" ]; then
            echo "dir=$(basename "$latest")"
            echo "parts=$(ls -1 "$latest"/part-* 2>/dev/null | wc -l)"
            echo "complete=$([ -f "$latest/complete" ] && echo yes || echo no)"
            echo "size=$(du -sh "$latest" | cut -f1)"
            cat "$latest"/part-* > /tmp/m.gz
            echo "gzip=$(gzip -t /tmp/m.gz 2>/dev/null && echo OK || echo BAD)"
          fi
          echo "=== state/data ==="
          du -sh "${d}/state/data" 2>/dev/null || echo none
