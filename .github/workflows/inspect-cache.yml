name: inspect state cache

# 只读诊断：恢复指定 app-state 缓存，dump 出 tasks 表数量，不部署、不碰隧道。
# 用于确认某个缓存快照里到底有几个任务，避免盲目恢复线上服务。
on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: "要检查的 cache key（如 app-state-44698074344）"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore target cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/inspect-state
          key: ${{ inputs.cache_key }}
          restore-keys: |
            app-state-

      - name: Check snapshot
        env:
          KEY: ${{ inputs.cache_key }}
        run: |
          set -uo pipefail
          echo "=== cache: ${KEY} ==="
          if [ ! -s /tmp/inspect-state/pg.sql.gz ]; then
            echo "无 pg.sql.gz"; ls -la /tmp/inspect-state 2>/dev/null | head; exit 0
          fi
          echo "pg.sql.gz size: $(du -sh /tmp/inspect-state/pg.sql.gz | cut -f1)"
          gzip -t /tmp/inspect-state/pg.sql.gz && echo "gzip OK" || { echo "gzip 损坏"; exit 0; }
          gzip -dc /tmp/inspect-state/pg.sql.gz > /tmp/snap.sql
          echo "sql size: $(du -sh /tmp/snap.sql | cut -f1)"

          # 起临时 postgres 恢复并数任务
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null 2>&1
          sudo service postgresql start >/dev/null 2>&1 || true
          sleep 3
          sudo -u postgres psql -c "DROP DATABASE IF EXISTS inspect;" >/dev/null 2>&1
          sudo -u postgres psql -c "CREATE DATABASE inspect;" >/dev/null 2>&1
          # 找 tasks 表的 COPY 段，统计行数即可（无需完整恢复）
          task_lines=$(grep -c '^COPY public.tasks ' /tmp/snap.sql || echo 0)
          echo "tasks COPY 段: ${task_lines}"

          # 直接完整恢复更可靠
          grep -v '^SET transaction_timeout' /tmp/snap.sql > /tmp/snap-clean.sql
          sudo -u postgres psql -d inspect -v ON_ERROR_STOP=0 -f /tmp/snap-clean.sql > /tmp/restore.log 2>&1 || true
          cnt=$(sudo -u postgres psql -d inspect -tAc 'SELECT count(*) FROM tasks;' 2>/dev/null || echo "?")
          echo "TASK COUNT IN SNAPSHOT: ${cnt}"
          echo "--- 最后 10 个任务 ---"
          sudo -u postgres psql -d inspect -tAc "SELECT id, created_at, name FROM tasks ORDER BY created_at DESC LIMIT 10;" 2>/dev/null || true
          {
            echo "### Cache 检查: ${KEY}"
            echo ""
            echo "- TASK COUNT: ${cnt}"
            echo "- pg.sql.gz: $(du -sh /tmp/inspect-state/pg.sql.gz | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
