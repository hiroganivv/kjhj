name: build toolchain image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/tools/Dockerfile"
      - "deploy/tools/install.py"
      - "deploy/tools/install.sh"
      - "deploy/tools/tool-catalog.json"
      - ".github/workflows/build-toolchain-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tools/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
            ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:${{ github.sha }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Toolchain image built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "sha: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
