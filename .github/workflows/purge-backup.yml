name: purge backup snapshots

# 一次性清空私有 backup repo 里的所有 snap-*.sql.gz，用于干净重部署验证。
# 用 secret 里的 SSH key 访问（否则我无法得知 backup repo 地址）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge all snapshots from backup repo
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_SSH_KEY }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO_SSH }}
        run: |
          set -uo pipefail
          if [ -z "${BACKUP_REPO:-}" ] || [ -z "${BACKUP_KEY:-}" ]; then
            echo "::error::BACKUP_REPO/BACKUP_KEY 未配置"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${BACKUP_KEY}" > ~/.ssh/id_ed25519_backup
          chmod 600 ~/.ssh/id_ed25519_backup
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_backup -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -p 443"
          dir=/tmp/purge-backup-$$
          if ! git clone "${BACKUP_REPO}" "${dir}" 2>/tmp/purge-clone.err; then
            echo "::error::clone 失败: $(tail -3 /tmp/purge-clone.err)"; exit 1
          fi
          cd "${dir}"
          echo "backup repo: ${BACKUP_REPO}"
          echo "=== 现有快照 ==="
          ls -1 snap-*.sql.gz 2>/dev/null || echo "(无)"
          cnt=$(ls -1 snap-*.sql.gz 2>/dev/null | wc -l)
          rm -f snap-*.sql.gz
          git config user.email "purge@local"; git config user.name "purge"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更（可能本来就没快照）"
          else
            git commit -m "purge all snapshots for clean redeploy" >/dev/null
            for attempt in 1 2 3; do
              git push origin HEAD:main >/dev/null 2>&1 && { echo "✓ 已清空 ${cnt} 个快照"; break; }
              git pull --rebase origin main >/dev/null 2>&1 || true
              sleep 3
            done || echo "::error::push 失败"
          fi
          echo "=== 清空后 ==="
          ls -1 snap-*.sql.gz 2>/dev/null || echo "(无快照)"
