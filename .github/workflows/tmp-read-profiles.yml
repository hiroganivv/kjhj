name: tmp read profiles

# 临时只读诊断：从指定 app-state 缓存恢复 pg.sql.gz，grep 出 LLM profile 数据，
# 用于找回丢失的 claude-new profile。不启动 app、不碰 frp、不碰线上服务。用完即删。
on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: "单个 app-state 缓存 key"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  read:
    runs-on: ubuntu-latest
    # app-state 缓存是在 deploy 的容器 job 里创建的，必须用同一镜像才能读到。
    container:
      image: ghcr.io/${{ github.repository_owner }}/kjhj-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Restore target cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/diag
          key: ${{ inputs.cache_key }}
          restore-keys: |
            app-state-

      - name: Dump profiles from snapshot
        env:
          KEY: ${{ inputs.cache_key }}
        run: |
          set -uo pipefail
          echo "===== CACHE: ${KEY} ====="
          if [ ! -s /tmp/diag/pg.sql.gz ]; then
            echo "NO pg.sql.gz"; ls -la /tmp/diag 2>/dev/null | head; exit 0
          fi
          echo "pg.sql.gz: $(du -sh /tmp/diag/pg.sql.gz | cut -f1)"
          gzip -dc /tmp/diag/pg.sql.gz > /tmp/diag.sql || { echo "gzip failed"; exit 0; }
          echo "sql: $(du -sh /tmp/diag.sql | cut -f1)"

          echo "----- tables with llm/profile -----"
          grep -iE 'CREATE TABLE' /tmp/diag.sql | grep -iE 'llm|profile' | head -20 || echo "(none)"

          echo "----- lines containing claude -----"
          grep -in 'claude' /tmp/diag.sql | head -40 || echo "(no claude found)"

          echo "----- llm profile tables COPY/INSERT blocks -----"
          for tbl in $(grep -iE 'CREATE TABLE' /tmp/diag.sql | grep -iE 'llm|profile' | sed -E 's/.*CREATE TABLE [^ ]*([a-zA-Z0-9_\."]+).*/\1/' | tr -d '"' | sed 's/.*\.//' | sort -u); do
            echo "### TABLE ${tbl}"
            awk -v t="${tbl}" '
              index($0, t){ if ($0 ~ /COPY|INSERT INTO/) {p=1} }
              p{print}
              p && /^\\\.$/ {p=0}
            ' /tmp/diag.sql | head -60
          done
          echo "===== END ${KEY} ====="
